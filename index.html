body[data-theme="violet"]{--bg:#f7f8fb;--white:#fff;--ink:#19202c;--muted:#8b93a2;--sub:#596273;--line:#e8ecf2;--lav:#6b60f8;--light:#edecff;--nav:#252839;--shadow:0 10px 34px rgba(23,31,58,.055);--accent2:#9f8fff;--hero1:#252839;--hero2:#3b3768}
body[data-theme="ocean"]{--bg:#f5fafb;--white:#ffffff;--ink:#13222a;--muted:#718791;--sub:#49636d;--line:#dce9ec;--lav:#0f9db0;--light:#dbf7fb;--nav:#11323a;--shadow:0 10px 34px rgba(16,51,60,.08);--accent2:#5dd5ea;--hero1:#11323a;--hero2:#145662}
body[data-theme="sunset"]{--bg:#fff8f4;--white:#ffffff;--ink:#2b1b1b;--muted:#8c7771;--sub:#6f5750;--line:#f1ddd6;--lav:#f26b4f;--light:#ffe5df;--nav:#3f2623;--shadow:0 10px 34px rgba(76,34,28,.08);--accent2:#ffb27e;--hero1:#432623;--hero2:#8d503b}
body[data-theme="graphite"]{--bg:#f5f6f8;--white:#ffffff;--ink:#171b21;--muted:#7b8493;--sub:#555f71;--line:#e2e6ed;--lav:#3f7cff;--light:#e9f0ff;--nav:#1c212b;--shadow:0 10px 34px rgba(20,25,34,.08);--accent2:#91b5ff;--hero1:#1c212b;--hero2:#2f3848}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:var(--shadow)}
.hero:after{content:'';position:absolute;inset:auto -40px -45px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent2),transparent 62%);opacity:.28}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 26px}
.quick-card,.insight-card,.setting-card,.accent-card,.collection-card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.quick-card{padding:16px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.quick-ico{width:42px;height:42px;border-radius:13px;background:var(--light);color:var(--lav);display:grid;place-items:center;flex:0 0 auto}
.quick-card h3,.insight-card h3,.accent-card h3,.collection-card h3{margin:0 0 4px;font-size:14px;letter-spacing:-.2px}
.quick-card p,.insight-card p,.collection-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.insight-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:14px;margin:0 0 26px}
.insight-card{padding:18px}
.ring-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.mini-pill{padding:8px 12px;background:var(--light);color:var(--lav);border-radius:999px;font-size:12px;font-weight:720}
.collection-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 26px}
.collection-card{padding:17px}
.collection-num{font-size:28px;font-weight:820;letter-spacing:-1px;margin:10px 0 3px}
.theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.theme-btn{border:1px solid var(--line);border-radius:16px;background:var(--white);padding:11px;text-align:left}
.theme-btn.active{border-color:var(--lav);box-shadow:0 0 0 2px color-mix(in srgb, var(--lav) 18%, transparent)}
.theme-swatch{display:flex;gap:6px;margin-bottom:10px}.theme-swatch span{width:18px;height:18px;border-radius:50%}
.toggle-list{display:grid;gap:11px;margin-top:16px}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.toggle-row:first-child{border-top:0;padding-top:0}
.switch{position:relative;width:48px;height:29px;border-radius:999px;background:#d7dce7;border:0;padding:0;transition:.2s}.switch:before{content:'';position:absolute;left:4px;top:4px;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.18)}.switch.on{background:var(--lav)}.switch.on:before{left:23px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{padding:7px 10px;border-radius:999px;font-size:11px;font-weight:760;background:var(--light);color:var(--lav)}
.banner{background:linear-gradient(135deg,color-mix(in srgb,var(--lav) 13%, white),var(--white));border:1px solid var(--line);padding:16px 18px;border-radius:18px;margin:0 0 18px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.banner h3{margin:0 0 5px;font-size:15px}.banner p{margin:0;color:var(--muted);font-size:12px}
.stack-preview{display:flex;align-items:center}.stack-preview span{width:44px;height:58px;border-radius:10px;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);margin-left:-15px}.stack-preview span:first-child{margin-left:0}
.actions-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.tipbar{background:linear-gradient(135deg,var(--light),white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px;font-size:12px;color:var(--sub);line-height:1.55}
.scan-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}.scan-tools .chip{cursor:pointer}
@media (max-width:980px){.quick-grid,.collection-row,.theme-grid,.stats.four,.actions-grid,.insight-grid{grid-template-columns:1fr 1fr}.insight-grid{grid-template-columns:1fr}.hero-main{max-width:100%}}
@media (max-width:700px){.quick-grid,.collection-row,.theme-grid,.stats.four,.actions-grid{grid-template-columns:1fr}.banner{flex-direction:column;align-items:flex-start}}

body.compact .main{padding-top:28px;padding-bottom:88px}body.compact .doc,.compact .stat,.compact .setting-card,.compact .quick-card,.compact .collection-card,.compact .insight-card{border-radius:14px}body.compact .doc{padding:10px}body.compact .heading{font-size:28px}

/* Folio Studio */
.studio-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.studio-tab{display:flex;align-items:center;gap:11px;padding:17px 13px;border:1px solid var(--line);background:var(--white);border-radius:18px;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.studio-tab.active{background:var(--light);border-color:var(--lav);box-shadow:0 5px 20px rgba(0,0,0,.025)}
.studio-tab .studio-icon{width:39px;height:39px;display:grid;place-items:center;background:var(--light);border-radius:12px;color:var(--lav);flex-shrink:0}
.studio-tab.active .studio-icon{background:var(--lav);color:white}
.studio-tab strong{font-size:13px;display:block;margin-bottom:3px}.studio-tab small{font-size:10px;color:var(--muted);display:block}
.studio-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(240px,.9fr);gap:14px;margin-bottom:22px}
.studio-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:23px;box-shadow:var(--shadow);min-width:0}
.studio-card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.4px}.studio-card .hint{font-size:12px;color:var(--muted);margin:0 0 22px;line-height:1.55}
.studio-field{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}.studio-field label{font-size:11px;font-weight:780;letter-spacing:.04em;color:var(--sub)}
.studio-field input,.studio-field textarea,.studio-field select{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 13px;color:var(--ink);outline-color:var(--lav);width:100%;font:inherit;font-size:13px}
.studio-field textarea{min-height:120px;resize:vertical;line-height:1.6}
.studio-preview{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;display:block;max-height:460px;object-fit:contain}
.studio-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.studio-actions button{min-height:44px}
.studio-colorpick{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.color-btn{width:31px;height:31px;border:3px solid #fff;outline:1px solid var(--line);border-radius:50%}.color-btn.active{outline:2px solid var(--lav)}
.create-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 0 8px}.create-help{font-size:11px;color:var(--muted);line-height:1.5}
.studio-table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:13px;max-height:460px}
.sheet{border-collapse:collapse;font-size:12px;width:100%;min-width:460px}.sheet th{background:var(--light);color:var(--sub);font-size:10px;padding:9px;border:1px solid var(--line);position:sticky;top:0;z-index:1}.sheet td{border:1px solid var(--line);padding:0}.sheet td input{width:100%;min-width:80px;border:0;background:white;padding:10px 8px;outline-color:var(--lav);font-size:12px}.sheet .rownumber{background:var(--bg);color:var(--muted);padding:7px 10px;text-align:center;width:38px;font-size:10px}
.studio-small-btn{border:1px solid var(--line);background:var(--white);padding:9px 12px;border-radius:10px;font-size:12px;font-weight:720;color:var(--ink)}
.created-list{display:grid;gap:9px}.created-item{border:1px solid var(--line);background:var(--white);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}.created-item .created-icon{width:39px;height:43px;background:var(--light);color:var(--lav);border-radius:11px;display:grid;place-items:center}.created-item strong{display:block;font-size:13px;overflow-wrap:anywhere}.created-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.share-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}.share-strip span{background:var(--light);color:var(--lav);font-size:10px;font-weight:740;padding:7px 10px;border-radius:100px}
.wide-studio{grid-column:1/-1}
@media(max-width:860px){.studio-layout{grid-template-columns:1fr}.studio-tabs{gap:7px}.studio-tab{padding:12px 9px}.studio-tab .studio-icon{width:32px;height:32px}.studio-tab small{display:none}}
@media(max-width:520px){.studio-tab{justify-content:center;flex-direction:column;text-align:center}.studio-tab strong{font-size:11px}.studio-card{padding:17px}.studio-actions{display:grid;grid-template-columns:1fr 1fr}.studio-actions .primary,.studio-actions .outline{padding:11px 10px}.created-item{flex-wrap:wrap}.created-item .created-icon{width:35px;height:36px}}


/* Account & launch edition */
.account-banner{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 20px;background:linear-gradient(120deg,var(--nav),#126b74);color:white;border-radius:18px;margin-bottom:18px}
.account-banner h3{margin:0 0 5px;font-size:17px}.account-banner p{margin:0;color:#d6e6ed;font-size:12px;line-height:1.5}
.account-banner button{white-space:nowrap}
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:20px}
.price-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;min-height:270px;box-shadow:var(--shadow)}
.price-card.featured{border:2px solid var(--lav);background:linear-gradient(160deg,var(--light),var(--white) 50%)}
.price-card .money{font-weight:850;font-size:39px;letter-spacing:-2px;margin:11px 0 4px}
.price-card .name{font-size:14px;font-weight:820}.price-card .micro{font-size:11px;color:var(--muted);line-height:1.6}.price-card .primary,.price-card .outline{margin-top:auto;width:100%;justify-content:center}
.price-card .tag{margin-bottom:10px;width:max-content}
.account-person{display:flex;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);padding:15px;border-radius:15px;margin-bottom:14px}
.account-avatar{width:43px;height:43px;border-radius:50%;background:var(--light);color:var(--lav);display:grid;place-items:center;font-weight:850;font-size:17px;overflow:hidden}
.account-avatar img{width:100%;height:100%;object-fit:cover}
.privacy-line{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 18px}
.launch-warning{border:1px solid var(--line);border-left:3px solid var(--lav);padding:13px 16px;border-radius:11px;background:var(--light);margin:0 0 20px;font-size:12px;color:var(--sub);line-height:1.65}
@media(max-width:840px){.price-grid{grid-template-columns:1fr 1fr}.account-banner{flex-direction:column;align-items:flex-start}}
@media(max-width:540px){.price-grid{grid-template-columns:1fr}.price-card{min-height:230px}.mobile-nav button{min-width:44px;font-size:9px}.mobile-nav{padding-left:3px;padding-right:3px}}

ake a picture, Excel sheet or a PDF in minutes.</p></div></button></div><div class="insight-grid"><div class="insight-card"><h3>Smart collections</h3><p>Your most-used folders are surfaced here so you can jump right back in.</p><div class="ring-row">${(top.length?top.slice(0,5):[['Personal',0],['Work',0],['Books',0]]).map(([name,count])=>`<span class="mini-pill">${esc(name)} · ${count}</span>`).join('')}</div></div><div class="insight-card"><h3>Storage snapshot</h3><p>${bytes(totalBytes())} stored locally across ${docs.length||0} documents. Export important PDFs for backup.</p><div class="badges"><span class="badge">Offline-first</span><span class="badge">No ads</span><span class="badge">Google sign-in optional</span></div></div></div><div class="account-banner"><div><h3>Meet Folio Plus ✨</h3><p>Free forever essentials. Optional 10¢ credits and a new $1 pack.</p></div><button class="hero-button" onclick="go('account')">Explore Plus</button></div><div class="section-head"><h2 class="section-title">Recent documents</h2><button class="text-button" onclick="go('library')">View all ${ico('arrow',14)}</button></div>${recent.length?`<div class="doc-list">${recent.map(docrow).join('')}</div>`:empty('Nothing here yet','Your scans will appear here after you save them.')}`}function empty(title,msg){return `<div class="empty"><div class="empty-ico">${ico('folder',32)}</div><h3>${title}</h3><p>${msg}</p><button class="primary" onclick="go('scan')">${ico('plus')} Scan a document</button></div>`}

function renderLibrary(){let found=docs.filter(d=>(filter==='All'||filter==='Starred'&&d.starred||d.category===filter)&&d.title.toLowerCase().includes(search.toLowerCase()));found.sort((a,b)=>sortRecent?b.updatedAt-a.updatedAt:a.title.localeCompare(b.title));const top=topCategories();E('main').innerHTML=topbar('ALL YOUR FILES','My library',`${docs.length} document${docs.length===1?'':'s'} safely in one place.`)+`<div class="banner"><div><h3>Cleaner library, faster browsing</h3><p>Filter by folder, star favourites, and sort your document shelf the way you like.</p></div><div class="stack-preview"><span></span><span></span><span></span></div></div><div class="searchbox">${ico('search')}<input id="search" placeholder="Search your documents…" value="${esc(search)}" oninput="updateSearch(this.value)" aria-label="Search documents"></div><div class="filters">${['All','Starred',...cats].map(c=>`<button class="chip ${filter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div><div class="collection-row">${(top.length?top.slice(0,3):[['Personal',0],['Work',0],['Books',0]]).map(([name,count])=>`<div class="collection-card"><h3>${esc(name)}</h3><div class="collection-num">${count}</div><p>${count===1?'document':'documents'} inside this folder</p></div>`).join('')}</div><div class="section-head"><h2 class="section-title">${filter==='All'?'All documents':esc(filter)} <span style="color:var(--muted);font-weight:500;font-size:13px">(${found.length})</span></h2><button class="text-button" onclick="sortRecent=!sortRecent;renderLibrary()">${ico('sort',15)} ${sortRecent?'Newest first':'Name A–Z'}</button></div>${found.length?`<div class="doc-list">${found.map(docrow).join('')}</div>`:empty('No matching documents','Try another search or scan a new page.')}`}function updateSearch(v){search=v;const input=E('search');const p=input.selectionStart;renderLibrary();const next=E('search');next.focus();next.setSelectionRange(p,p)}

function renderScan(){E('main').innerHTML=topbar('CAPTURE & SAVE','New scan','Add pages, enhance them, and keep a PDF.',false)+`<section class="scanpanel"><div class="scan-intro"><div class="scan-icon">${ico('scan',37)}</div><h2>${draft.length?'Make your document':'Scan your first page'}</h2><p>${draft.length?'Edit, reorder and polish your pages. Then name and save your document.':'Use your camera, gallery or existing PDFs. Everything stays on your device.'}</p><div class="scan-tools"><span class="chip active">${smartTitleHint()}</span><span class="chip">${prefs.enhance?'Auto-enhance ready':'Manual enhance'}</span><span class="chip">Local-only</span></div></div><div class="actions-grid"><button class="action-box" onclick="E('cameraInput').click()">${ico('camera',25)} Camera<small>Capture a page</small></button><button class="action-box" onclick="E('galleryInput').click()">${ico('image',25)} Gallery<small>Select one or more</small></button><button class="action-box" onclick="E('pdfInput').click()">${ico('upload',25)} Import PDF<small>Bring in an existing file</small></button></div>${draft.length?`<div class="divider"></div><div class="draft-head">Pages <span style="color:var(--muted)">(${draft.length})</span></div><div class="draft-grid">${draft.map((p,i)=>`<div class="draft-tile"><div class="draft-img"><img src="${bloburl(p)}" alt="Draft page ${i+1}"></div><div class="draft-bottom"><span>Page ${i+1}</span><div class="draft-tools"><button class="mini" onclick="moveDraft(${i},-1)" aria-label="Move page left">${ico('left')}</button><button class="mini" onclick="moveDraft(${i},1)" aria-label="Move page right">${ico('right')}</button><button class="mini" onclick="openEditor(${i})" aria-label="Edit page">${ico('edit')}</button><button class="mini" onclick="dropDraft(${i})" aria-label="Remove page">${ico('trash')}</button></div></div></div>`).join('')}</div><div class="tipbar"><strong>Pro tip:</strong> use the edit tool on each page for a clean crop and sharper scan look before saving.</div><div class="form-row"><div class="field"><label>DOCUMENT NAME</label><input id="docTitle" maxlength="90" placeholder="My document" value="${esc(renderScan.nameValue||'')}"></div><div class="field"><label>FOLDER</label><select id="docCat">${cats.map(c=>`<option value="${c}" ${renderScan.catValue===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="savebar"><button class="outline" onclick="draft=[];renderScan()">Clear</button><button class="primary" onclick="saveDraft()">${ico('check')} Save document</button></div>`:`<div class="tipbar"><strong>Looks better already:</strong> I added quicker actions, richer colours, and a smoother layout. For the cleanest pages, use even lighting and place the paper on a darker background.</div>`}</section>`;E('docTitle')?.addEventListener('input',e=>renderScan.nameValue=e.target.value);E('docCat')?.addEventListener('change',e=>renderScan.catValue=e.target.value)}function moveDraft(i,delta){const j=i+delta;if(j<0||j>=draft.length)return;[draft[i],draft[j]]=[draft[j],draft[i]];renderScan()}

async function imageFromFile(file,max=1900){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);const x=c.getContext('2d',{alpha:false});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('Could not read image')),'image/jpeg',.88))}finally{URL.revokeObjectURL(url)}}
async function importImages(files){const arr=Array.from(files||[]).filter(f=>f.type.startsWith('image/'));if(!arr.length)return;toast(`Importing ${arr.length} page${arr.length>1?'s':''}…`);try{for(const f of arr){draft.push(await imageFromFile(f))}go('scan');toast(`${arr.length} page${arr.length>1?'s':''} added`)}catch(e){alert('Could not import one of the images. '+e.message)}}
async function importPdfs(files){const arr=Array.from(files||[]).filter(f=>f.type==='application/pdf'||f.name.endsWith('.pdf'));if(!arr.length)return;for(const f of arr){const doc={id:uuid(),title:f.name.replace(/\.pdf$/i,''),category:'Personal',starred:false,createdAt:Date.now(),updatedAt:Date.now(),pages:[],pdf:f};await dbWrite(doc);docs.push(doc)}go('library');toast(`Imported ${arr.length} PDF${arr.length===1?'':'s'}`)}
async function saveDraft(){if(busy||!draft.length)return;busy=true;try{const title=E('docTitle')?.value?.trim()||`Scan ${date(Date.now())}`;const category=E('docCat')?.value||'Personal';const doc={id:uuid(),title:title.slice(0,90),category,starred:false,createdAt:Date.now(),updatedAt:Date.now(),pages:[...draft],pdf:null};await dbWrite(doc);docs.push(doc);draft=[];renderScan.nameValue='';renderScan.catValue='Personal';go('library');toast('Document saved on this device')}catch(e){alert('Unable to save: '+e.message)}finally{busy=false}}
async function pdfFromImages(pages){const te=new TextEncoder();const parts=[];let offset=0,offsets=[0];const push=bytes=>{const a=typeof bytes==='string'?te.encode(bytes):bytes;parts.push(a);offset+=a.length};const obj=(id,content)=>{offsets[id]=offset;push(`${id} 0 obj\n`);if(typeof content==='string')push(content);else content.forEach(push);push('\nendobj\n')};let n=2,ids=[];for(let i=0;i<pages.length;i++){ids.push({page:n++,content:n++,image:n++})}const total=n-1;push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');obj(1,`<< /Type /Catalog /Pages ${total+1} 0 R >>`);for(let i=0;i<pages.length;i++){const src=pages[i];const url=bloburl(src);const img=new Image();img.src=url;await img.decode();const w=img.naturalWidth,h=img.naturalHeight;const buffer=new Uint8Array(await src.arrayBuffer());const g=ids[i];const ratio=Math.min(595/w,842/h),dw=w*ratio,dh=h*ratio;const x=(595-dw)/2,y=(842-dh)/2;obj(g.page,`<< /Type /Page /Parent ${total+1} 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${i} ${g.image} 0 R >> >> /Contents ${g.content} 0 R >>`);const stream=`q\n${dw.toFixed(3)} 0 0 ${dh.toFixed(3)} ${x.toFixed(3)} ${y.toFixed(3)} cm\n/Im${i} Do\nQ\n`;obj(g.content,`<< /Length ${te.encode(stream).length} >>\nstream\n${stream}endstream`);obj(g.image,[`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${buffer.length} >>\nstream\n`,buffer,'\nendstream'])}obj(total+1,`<< /Type /Pages /Count ${pages.length} /Kids [${ids.map(g=>g.page+' 0 R').join(' ')}] >>`);const xref=offset;push(`xref\n0 ${total+2}\n0000000000 65535 f \n`);for(let i=1;i<=total+1;i++)push(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);push(`trailer\n<< /Size ${total+2} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function exportDoc(id){const d=docs.find(x=>x.id===id);if(!d)return;toast('Preparing PDF…');try{const pdf=d.pdf||await pdfFromImages(d.pages);const name=d.title.replace(/[\\/:*?"<>|]/g,'_')+'.pdf';download(pdf,name);toast('PDF downloaded')}catch(e){alert('PDF export failed: '+e.message)}}

function posterWrap(ctx,text,x,y,maxWidth,lineHeight,maxLines){const paragraphs=String(text).split('\n');let lines=0;for(const para of paragraphs){let line='';for(const word of para.split(/\s+/)){if(!word)continue;const candidate=line?line+' '+word:word;if(ctx.measureText(candidate).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;lines++;line=word;if(lines>=maxLines)return y}else line=candidate;}if(line){ctx.fillText(line,x,y);y+=lineHeight;lines++;}else y+=lineHeight*.55;if(lines>=maxLines)return y}return y}

function csvEscape(v){let s=String(v??'');return /[,\n\r"]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function sheetCSV(){return new Blob(['\ufeff'+sheetGrid.map(row=>row.map(csvEscape).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})}
function parseCSV(text){const rows=[];let row=[],field='',inside=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(inside&&text[i+1]==='"'){field+='"';i++}else inside=!inside}else if(ch===','&&!inside){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!inside){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field=''}else field+=ch;}if(field||row.length){row.push(field);rows.push(row)}return rows}
async function importCSV(file){try{let rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(!rows.length)throw Error('CSV is empty');let cols=Math.max(1,Math.min(15,...rows.map(r=>r.length)));sheetGrid=rows.slice(0,100).map(r=>Array.from({length:cols},(_,i)=>r[i]||''));sheetName=file.name.replace(/\.csv$/i,'');studioMode='excel';persistStudio();renderCreate();toast('CSV imported')}catch(e){alert('Could not import CSV: '+e.message)}}
function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}

function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function zipFiles(files){const encoder=new TextEncoder();const chunks=[],directory=[];let position=0;const push=b=>{chunks.push(b);position+=b.length};const num=(n,size)=>{let a=new Uint8Array(size);for(let i=0;i<size;i++)a[i]=(n>>>8*i)&255;return a};for(const [name,content] of files){const nb=encoder.encode(name),data=encoder.encode(content),crc=crc32(data),offset=position;push(num(0x04034b50,4));push(num(20,2));push(num(0,2));push(num(0,2));push(num(0,2));push(num(0,2));push(num(crc,4));push(num(data.length,4));push(num(data.length,4));push(num(nb.length,2));push(num(0,2));push(nb);push(data);directory.push({nb,crc,len:data.length,offset})}const centralStart=position;for(const d of directory){push(num(0x02014b50,4));push(num(20,2));push(num(20,2));push(num(0,2));push(num(0,2));push(num(0,2));push(num(0,2));push(num(d.crc,4));push(num(d.len,4));push(num(d.len,4));push(num(d.nb.length,2));push(num(0,2));push(num(0,2));push(num(0,2));push(num(0,2));push(num(0,4));push(num(d.offset,4));push(d.nb)}let centralSize=position-centralStart;push(num(0x06054b50,4));push(num(0,2));push(num(0,2));push(num(directory.length,2));push(num(directory.length,2));push(num(centralSize,4));push(num(centralStart,4));push(num(0,2));return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function makeXlsx(){const types=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;const rootRels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;const workbook=`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets><calcPr fullCalcOnLoad="1"/></workbook>`;const workbookRels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;return zipFiles([['[Content_Types].xml',types],['_rels/.rels',rootRels],['xl/workbook.xml',workbook],['xl/_rels/workbook.xml.rels',workbookRels],['xl/worksheets/sheet1.xml',sheetXml()]])}

async function typedPdf(){const width=1240,height=1754,pad=125,canvases=[];let c,cv,y,page=0;const next=()=>{cv=document.createElement('canvas');cv.width=width;cv.height=height;c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,width,height);c.fillStyle='#0c8c9d';c.fillRect(pad,126,60,7);c.fillStyle='#1b2c3c';c.font='bold 22px Arial';c.fillText('FOLIO  /  DOCUMENT',pad,100);y=230;page++;canvases.push(cv)};next();c.font='bold 62px Arial';c.fillStyle='#18243a';y=pdfWrap(pdfTitle,c,pad,y,width-2*pad,74,4);y+=12;c.fillStyle='#7b8798';c.font='29px Arial';y=pdfWrap(pdfSubtitle,c,pad,y,width-2*pad,43,3);y+=55;c.fillStyle='#203044';c.font='29px Arial';let all=String(pdfBody||'').split('\n');for(const para of all){if(!para.trim()){y+=23;continue}const words=para.trim().split(/\s+/);let line='';for(const word of words){const maybe=line?line+' '+word:word;if(c.measureText(maybe).width>width-2*pad&&line){if(y>height-pad-65){next();c.fillStyle='#203044';c.font='29px Arial'}c.fillText(line,pad,y);y+=47;line=word}else line=maybe}if(line){if(y>height-pad-65){next();c.fillStyle='#203044';c.font='29px Arial'}c.fillText(line,pad,y);y+=47}y+=23}return Promise.all(canvases.map((canvas,i)=>{const x=canvas.getContext('2d');x.fillStyle='#9ca9b6';x.font='22px Arial';x.fillText(`Page ${i+1} of ${canvases.length}`,width-pad-145,height-77);return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PDF page failed')),'image/jpeg',.91))})).then(pages=>pdfFromImages(pages))}
function pdfWrap(text,c,x,y,maxWidth,lineHeight,maxLines){let line='',n=0;for(const word of String(text).split(/\s+/)){let next=line?line+' '+word:word;if(c.measureText(next).width>maxWidth&&line){c.fillText(line,x,y);y+=lineHeight;n++;line=word;if(n>=maxLines)return y}else line=next}if(line){c.fillText(line,x,y);y+=lineHeight}return y}
function safeFile(n){return String(n).trim().slice(0,100).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_')||'Folio file'}
async function createStudioFile(force){if(studioMode==='picture'){const o=await pictureFile();return o}if(studioMode==='excel'){const csv=force==='csv';return{name:safeFile(sheetName)+(csv?'.csv':'.xlsx'),kind:'excel',blob:csv?sheetCSV():makeXlsx(),type:csv?'text/csv':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}}const blob=await typedPdf();return{name:safeFile(pdfTitle)+'.pdf',kind:'pdf',blob,type:'application/pdf'}}

async function applyEditor(){try{const c=E('editcanvas'),r=document.createElement('canvas');r.width=Math.max(1,Math.round(c.width*editorCrop.w));r.height=Math.max(1,Math.round(c.height*editorCrop.h));r.getContext('2d').drawImage(c,Math.round(c.width*editorCrop.x),Math.round(c.height*editorCrop.y),r.width,r.height,0,0,r.width,r.height);const b=await new Promise(res=>r.toBlob(res,'image/jpeg',.9));draft[editorIndex]=b;closeEditor();renderScan();toast('Page updated')}catch(e){alert('Unable to edit page: '+e.message)}}
function closeEditor(){E('editorModal').classList.remove('show');editorIndex=-1}
function setupDrag(){const box=E('cropbox');let state=null;box.addEventListener('pointerdown',e=>{const r=E('editcanvas').getBoundingClientRect();state={handle:e.target.dataset.handle||'move',sx:e.clientX,sy:e.clientY,original:{...editorCrop},w:r.width,h:r.height};box.setPointerCapture(e.pointerId);e.preventDefault()});box.addEventListener('pointermove',e=>{if(!state)return;const dx=(e.clientX-state.sx)/state.w,dy=(e.clientY-state.sy)/state.h;const a=state.original;let x=a.x,y=a.y,w=a.w,h=a.h;if(state.handle==='move'){x=Math.min(1-w,Math.max(0,x+dx));y=Math.min(1-h,Math.max(0,y+dy))}else{if(state.handle.includes('l')){x=Math.min(a.x+a.w-.15,Math.max(0,a.x+dx));w=a.w+(a.x-x)}if(state.handle.includes('r')){w=Math.max(.15,Math.min(1-a.x,a.w+dx))}if(state.handle.includes('t')){y=Math.min(a.y+a.h-.15,Math.max(0,a.y+dy));h=a.h+(a.y-y)}if(state.handle.includes('b')){h=Math.max(.15,Math.min(1-a.y,a.h+dy))}}editorCrop={x,y,w,h};layoutCrop()});box.addEventListener('pointerup',()=>state=null);box.addEventListener('pointercancel',()=>state=null);addEventListener('resize',()=>{if(editorIndex>=0)layoutCrop()})}
async function startup(){E('brandicon').innerHTML=ico('scan',22);E('closeedit').innerHTML=ico('close');E('rotatebtn').innerHTML=ico('rotate')+' Rotate';E('filterbtn').innerHTML=ico('sliders')+' Enhance';E('resetbtn').innerHTML=ico('scan')+' Reset crop';E('applybtn').innerHTML=ico('check')+' Apply';E('cameraInput').addEventListener('change',async e=>{await importImages(e.target.files);e.target.value='' });E('galleryInput').addEventListener('change',async e=>{await importImages(e.target.files);e.target.value='' });E('pdfInput').addEventListener('change',async e=>{await importPdfs(e.target.files);e.target.value='' });E('csvInput').addEventListener('change',async e=>{if(e.target.files[0])await importCSV(e.target.files[0]);e.target.value=''});setupDrag();applyTheme();try{await initStorage();docs=await dbRead();creations=(await creationsRead()).sort((a,b)=>b.createdAt-a.createdAt);E('storageState').textContent='Local storage ready';if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}catch(e){E('storageState').textContent='Temporary session only';toast('Local storage blocked; exports recommended')}render();}
startup();
</script>
