name: Publish Folio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Folio app and payment source
        shell: bash
        run: |
          set -euo pipefail
          node --check payment.js
          node --check auth.js
          node --check functions/index.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public Folio website returns the app, not 404
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Published URL: $url"
          for attempt in {1..8}; do
            code=$(curl --location --silent --show-error --output /tmp/folio-check.html --write-out '%{http_code}' --max-time 20 "$url" || true)
            echo "Public HTTP status attempt $attempt: $code"
            if [[ "$code" == "200" ]] && grep -qi "Folio" /tmp/folio-check.html; then
              echo "SUCCESS: Public Folio app is served at $url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public site did not return Folio HTML. Deployment success alone is not enough."
          exit 1
